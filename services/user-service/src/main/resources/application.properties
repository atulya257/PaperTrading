spring.application.name=user-service

server.port=8082

# The password comes from the MYSQL_PASSWORD environment variable, never from this file
spring.datasource.url=jdbc:mysql://localhost:3306/tradelab_users?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

tradelab.security.max-failed-logins=5
tradelab.security.lock-minutes=15
