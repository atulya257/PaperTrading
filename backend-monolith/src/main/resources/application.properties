spring.application.name=tradelab-backend

# H2 in-memory database with a fixed name, so the H2 console URL is always jdbc:h2:mem:tradelabdb
spring.datasource.url=jdbc:h2:mem:tradelabdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Login and security
# Token lifetime; leave tradelab.jwt.secret empty to use a random signing key per run
tradelab.jwt.expiry-minutes=120
tradelab.jwt.secret=
tradelab.security.max-failed-logins=5
tradelab.security.lock-minutes=15
