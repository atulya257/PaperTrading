spring.application.name=user-service

# Each microservice runs on its own port. The User Service uses 8082.
server.port=8082

# Its own MySQL database. The password is read from the MYSQL_PASSWORD environment variable,
# so it is never written into this file or committed to git.
spring.datasource.url=jdbc:mysql://localhost:3306/tradelab_users?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Lock an account for this long after this many wrong passwords
tradelab.security.max-failed-logins=5
tradelab.security.lock-minutes=15
