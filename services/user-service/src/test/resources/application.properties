spring.application.name=user-service

# Tests use an in-memory H2 database in MySQL mode instead of the real MySQL server.
spring.datasource.url=jdbc:h2:mem:userdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

tradelab.security.max-failed-logins=5
tradelab.security.lock-minutes=15
